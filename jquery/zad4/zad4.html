<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Zdarzenie click</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $(function(){
        
        $("#naPoczatek").click(function(){
            $produkt = $("#produkt").val();
            if(produkt.length > 0){
                $("ul").prepend('<li>'+$produkt+'</li>');
                $("li").first().css({
                "color":"green",
                "font-weight":"bold" 
            })
                $("#produkt").val(""); 
            }  
        })


        let $a = 0;
        $("#naKoniec").click(function(){
            if(produkt.length > 0){
            $produkt = $("#produkt").val();
             $("ul").append('<li>'+$produkt+'</li>');
             $("li").last().css({
                "color":"blue",
                "font-weight":"bold"
            })
        }
      })

      $("#accept").change(function(){
        if(this.checked){
            $("#send").removeAttr("disabled");
        }else{
            $("#send").attr("disabled", "disabled");
        }
        
      })

    })


  </script>
  <style>  
  </style>
</head>
<body>
    <ul id="lista">
  <li>Chleb</li>
  <li>Mleko</li>
</ul>
<input type="text" id="produkt" placeholder="Nazwa produktu">
<button id="naKoniec">Dodaj na koniec</button>
<button id="naPoczatek">Dodaj na początek</button>

<input type="checkbox" id="accept">
<label for="accept">Czy akceptujesz?</label>
<button id="send" disabled>Wyślij</button>

</body>
</html>
